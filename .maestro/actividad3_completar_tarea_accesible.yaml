appId: com.taskmanager.app
---

- launchApp

- extendedWaitUntil:
    visible: "Task Manager"
    timeout: 20000

- tapOn: "Flujo Todo List"

- extendedWaitUntil:
    visible: "Nueva tarea"
    timeout: 10000

# Damos foco al campo de título.
- tapOn:
    id: "input-titulo"

# Ingresamos el título de la tarea.
- inputText: "Validar accesibilidad Maestro2"

# Confirmamos que el texto fue ingresado.
- assertVisible: "Validar accesibilidad Maestro2"

# Guardamos la tarea utilizando la acción Enter/Done del teclado.
- pressKey: enter

# Confirmamos que la creación fue exitosa.
- extendedWaitUntil:
    visible: "Tarea creada exitosamente"
    timeout: 10000

# Confirmamos que la nueva tarea aparece en la lista.
- extendedWaitUntil:
    visible: "Validar accesibilidad Maestro2"
    timeout: 10000

# Marcamos la tarea como completada usando un identificador estable.
- tapOn:
    id: "boton-toggle-estado"

# Confirmamos visualmente el cambio de estado.
- extendedWaitUntil:
    visible: "✓ Completada"
    timeout: 5000

# Filtramos únicamente las tareas completadas.
- tapOn: "Completadas"

# Confirmamos que la tarea completada aparece en el filtro.
- assertVisible: "Validar accesibilidad Maestro2"